    <h1>Modulo di Registrazione</h1>

    <!-- Form con invio in GET verso conferma.html -->
    <form action="conferma.html" method="GET">
        
        <p>
            <label for="nome">Nome e Cognome:</label><br>
            <input type="text" id="nome" name="nome" required>
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required>
        </p>

        <p>
            <label for="piattaforma">Piattaforma:</label><br>
            <select id="piattaforma" name="piattaforma" required>
                <option value="">Seleziona...</option>
                <option value="pc">PC</option>
                <option value="console">Console</option>
            </select>
        </p>

        <p>
            <button type="submit">Invia</button>
        </p>

    </form>
